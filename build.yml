name: Build YTControl (iOS 8)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos (Linux toolchain)
        uses: Randomblock1/theos-action@v1

      - name: Add iOS 9.3 SDK
        run: |
          T="${THEOS:-$HOME/theos}"
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$T/sdks"
          cp -R /tmp/sdks/iPhoneOS9.3.sdk "$T/sdks/"
          ls "$T/sdks"

      - name: Build
        run: make package FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: YTControl-ios8
          path: packages/*.deb
